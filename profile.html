<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Operator profile — LastStandLog" />
  <title>Operator Profile — LastStandLog</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/profile.css" />
</head>
<body>

  <header class="site-header">
    <a href="/index.html" class="back-btn" title="Back to home" aria-label="Back to home">&#8592;</a>
    <div class="header-brand">
      <span class="site-title">LastStandLog</span>
      <span class="site-subtitle" id="site-subtitle"></span>
    </div>
  </header>

  <!-- Profile identity bar -->
  <div class="profile-header">
    <div class="profile-avatar" id="profile-avatar" aria-hidden="true">?</div>
    <div class="profile-info">
      <div class="profile-label">Operator</div>
      <div id="profile-name-row" class="profile-name-row">
        <span id="profile-name" class="profile-name">Loading...</span>
        <button id="profile-edit-name-btn" class="profile-edit-btn" title="Edit name" aria-label="Edit operator name">✎</button>
      </div>
      <div id="profile-stats-row" class="profile-stats-row"></div>
    </div>
    <div class="profile-header-actions-wrap">
      <div class="profile-header-actions">
        <button id="profile-menu-btn" class="profile-menu-btn" title="Operator options" aria-label="Operator options">⋯</button>
      </div>
    </div>
  </div>

  <!-- Section tabs -->
  <nav class="profile-tabs" role="tablist" aria-label="Profile sections">
    <button class="tab-btn" data-tab="loadout" role="tab" aria-selected="false" aria-controls="tab-loadout">Loadout</button>
    <button class="tab-btn" data-tab="rangelog" role="tab" aria-selected="false" aria-controls="tab-rangelog">Range Log</button>
    <button class="tab-btn" data-tab="shtf" role="tab" aria-selected="false" aria-controls="tab-shtf">SHTF Tracker</button>
  </nav>

  <main class="main-content">

    <!-- ── LOADOUT TAB ─────────────────────────────────────── -->
    <section id="tab-loadout" class="tab-section" role="tabpanel" aria-labelledby="tab-loadout-btn">
      <div class="toolbar">
        <span class="toolbar-title">Loadout</span>
        <div class="toolbar-actions">
          <button class="btn btn-secondary btn-sm" id="loadout-print-btn" title="Print loadout">🖨 Print</button>
          <button class="btn btn-primary" id="loadout-add-btn">+ Add Item</button>
        </div>
      </div>
      <div id="loadout-content"></div>
    </section>

    <!-- ── RANGE LOG TAB ───────────────────────────────────── -->
    <section id="tab-rangelog" class="tab-section" role="tabpanel" aria-labelledby="tab-rangelog-btn">
      <div class="toolbar">
        <span class="toolbar-title">Range Log</span>
        <div class="toolbar-actions">
          <button class="btn btn-secondary btn-sm" id="rangelog-export-btn" title="Export to CSV">↓ CSV</button>
          <button class="btn btn-primary" id="rangelog-add-btn">+ New Session</button>
        </div>
      </div>
      <div id="rangelog-stats"></div>
      <div id="rangelog-content"></div>
    </section>

    <!-- ── SHTF TRACKER TAB ────────────────────────────────── -->
    <section id="tab-shtf" class="tab-section" role="tabpanel" aria-labelledby="tab-shtf-btn">
      <div class="toolbar">
        <span class="toolbar-title">SHTF Tracker</span>
      </div>

      <div id="shtf-alerts"></div>

      <nav class="shtf-tabs" role="tablist" aria-label="SHTF categories">
        <button class="shtf-tab-btn" data-shtf="overview" role="tab" aria-selected="false">Overview</button>
        <button class="shtf-tab-btn" data-shtf="food"     role="tab" aria-selected="false">Food</button>
        <button class="shtf-tab-btn" data-shtf="water"    role="tab" aria-selected="false">Water</button>
        <button class="shtf-tab-btn" data-shtf="medical"  role="tab" aria-selected="false">Medical</button>
        <button class="shtf-tab-btn" data-shtf="gear"     role="tab" aria-selected="false">Gear</button>
        <button class="shtf-tab-btn" data-shtf="ammo"     role="tab" aria-selected="false">Ammo</button>
        <button class="shtf-tab-btn" data-shtf="prepplans" role="tab" aria-selected="false">Prep Plans</button>
        <button class="shtf-tab-btn" data-shtf="bugout"   role="tab" aria-selected="false">Bug-Out Plans</button>
        <button class="shtf-tab-btn" data-shtf="seeds"    role="tab" aria-selected="false">Seed Bank</button>
      </nav>

      <div id="shtf-overview" class="shtf-subsection"></div>

      <div id="shtf-food" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="food">+ Add Food</button></div>
        <div id="shtf-food-content"></div>
      </div>
      <div id="shtf-water" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="water">+ Add Water</button></div>
        <div id="shtf-water-content"></div>
      </div>
      <div id="shtf-medical" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="medical">+ Add Medical</button></div>
        <div id="shtf-medical-content"></div>
      </div>
      <div id="shtf-gear" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="gear">+ Add Gear</button></div>
        <div id="shtf-gear-content"></div>
      </div>
      <div id="shtf-ammo" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="ammo">+ Add Ammo</button></div>
        <div id="shtf-ammo-content"></div>
      </div>
      <div id="shtf-prepplans" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="prepplans">+ Add Plan</button></div>
        <div id="shtf-prepplans-content"></div>
      </div>
      <div id="shtf-bugout" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="bugout">+ Add Bug-Out Plan</button></div>
        <div id="shtf-bugout-content"></div>
      </div>
      <div id="shtf-seeds" class="shtf-subsection">
        <div class="toolbar"><span></span><button class="btn btn-primary shtf-add-btn" data-type="seeds">+ Add Seeds</button></div>
        <div id="shtf-seeds-content"></div>
      </div>
    </section>

  </main>

  <!-- Back to top -->
  <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

  <!-- Shared Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Add Item</span>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/loadout.js"></script>
  <script src="/js/range-log.js"></script>
  <script src="/js/shtf.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>

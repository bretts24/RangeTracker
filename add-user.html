<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Add a new operator to LastStandLog." />
  <title>Add Operator — LastStandLog</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <header class="site-header">
    <a href="/index.html" class="back-btn" title="Back to home">&#8592;</a>
    <div class="header-brand">
      <span class="site-title">Add Operator</span>
      <span class="site-subtitle">LastStandLog</span>
    </div>
  </header>

  <main class="main-content">
    <div class="add-user-container">
      <div class="add-user-card">
        <h2 class="add-user-heading">New Operator Profile</h2>
        <p class="add-user-desc">Enter a callsign or name to create a new profile. They will have full access to Loadout, Range Log, and Supplies.</p>

        <form id="add-user-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="user-name">Callsign / Name</label>
            <input
              type="text"
              id="user-name"
              name="name"
              class="form-input"
              placeholder="e.g. Dillon"
              maxlength="50"
              required
            />
          </div>
          <div class="form-actions" style="margin-top: var(--space-lg); padding-top: 0; border-top: none; justify-content: space-between;">
            <a href="/index.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" id="submit-btn" class="btn btn-primary">Create Profile</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/add-user.js"></script>
</body>
</html>
